[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-starter"
version = "0.1.0"
description = "Get started with Quantum Machine Learning in 5 lines of code"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Darshan Gorasiya" }]
keywords = ["quantum", "machine-learning", "qiskit", "classification", "qml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "qiskit>=2.0",
    "qiskit-machine-learning>=0.8",
    "scikit-learn>=1.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Repository = "https://github.com/dv-gorasiya/quantum-machine-learning"
Issues = "https://github.com/dv-gorasiya/quantum-machine-learning/issues"

[tool.setuptools.packages.find]
include = ["qml_starter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
